name: Build TagLauncher Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 配置Node + npm淘宝源，全程只用npm
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Change npm mirror
        run: npm config set registry https://registry.npmmirror.com

      # Rust+清华源
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Cargo mirror config
        run: |
          New-Item -Path $env:USERPROFILE\.cargo -ItemType Directory -Force
          @"
          [source.crates-io]
          replace-with = 'tsinghua'
          [source.tsinghua]
          registry = "https://mirrors.tuna.tsinghua.edu.cn/git/crates.io-index.git"
          "@ | Out-File $env:USERPROFILE\.cargo\config.toml

      # 安装tauri打包依赖
      - name: Install WebView2
        run: choco install webview2-runtime -y

      # npm安装依赖+打包（替换pnpm）
      - name: Install & Build
        run: |
          npm install
          npm run tauri build

      # 上传成品
      - name: Upload EXE&MSI
        uses: actions/upload-artifact@v4
        with:
          name: TagLauncher-Win
          path: |
            target/release/bundle/exe/*.exe
            target/release/bundle/msi/*.msi
