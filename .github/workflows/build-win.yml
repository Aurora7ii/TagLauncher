name: Build TagLauncher Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 安装Node + 自动安装pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm globally
        run: npm install -g pnpm
      - name: Switch npm to taobao mirror
        run: |
          npm config set registry https://registry.npmmirror.com
          pnpm config set registry https://registry.npmmirror.com

      # 配置Rust清华源
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Config Cargo source
        run: |
          New-Item -Path $env:USERPROFILE\.cargo -ItemType Directory -Force
          @"
          [source.crates-io]
          replace-with = 'tuna'
          [source.tuna]
          registry = "https://mirrors.tuna.tsinghua.edu.cn/git/crates.io-index.git"
          "@ | Out-File $env:USERPROFILE\.cargo\config.toml

      # 安装Tauri依赖WebView2
      - name: Install WebView2
        run: choco install webview2-runtime -y

      # 安装项目依赖 & 打包
      - name: Install deps & Build
        run: |
          pnpm install
          pnpm tauri build

      # 上传产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TagLauncher-Win-Build
          path: |
            target/release/bundle/exe/*.exe
            target/release/bundle/msi/*.msi
